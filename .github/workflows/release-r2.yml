# Release yayınlandığında Electron build alınır ve çıktılar Cloudflare R2'ye yüklenir.
# Gerekli GitHub Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
# Opsiyonel: NPM_TOKEN (GitHub Packages için, @ai-music-corp paketleri)

name: Build & Upload to R2 on Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write  # 🌟 electron-builder'ın release sayfasına dosya yükleyebilmesi için 'write' olmalı
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # GitHub Packages (@ai-music-corp) için .npmrc — NPM_TOKEN secret'ı tanımlıysa yazılır (if'te secrets kullanılamaz)
      - name: Configure npm for GitHub Packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # GITHUB_TOKEN yedegi kaldirildi: bu repo aimusiccompany altinda, paket ise
          # ai-music-corp org'una ait. Repo kapsamli GITHUB_TOKEN baska bir org'un
          # paketlerine hicbir zaman erisemez; yedek olarak kullanildiginda net bir
          # "token yok" hatasi yerine kafa karistirici bir 401 uretiyordu.
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret'i tanimli degil."
            echo "::error::@ai-music-corp paketleri icin read:packages kapsamli bir GitHub PAT gerekiyor."
            exit 1
          fi
          echo "@ai-music-corp:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=$NPM_TOKEN" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build app bundle
        run: npm run build

      # 🌟 electron-builder hem derleme yapacak hem de GITHUB_TOKEN yardımıyla çıktıları doğrudan GitHub Release'e yükleyecek
      - name: Run npm run dist and Publish
        run: npm run dist
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Derlenen tüm çıktılar (updates klasörü altına) Cloudflare R2'ye gönderilir
      - name: Upload to Cloudflare R2
        uses: ryand56/r2-upload-action@v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist
          destination-dir: updates
          output-file-url: true